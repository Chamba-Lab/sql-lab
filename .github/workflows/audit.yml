# Checks every pinned dependency (and what it pulls in) against the known
# vulnerabilities in the Python Packaging Advisory Database and OSV, with pip-audit.
# Runs on every change and once a week, so a new advisory shows up even when
# nobody touches the repository.
name: audit

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 12 * * 1"  # Mondays, 12:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: python -m pip install --disable-pip-version-check pip-audit==2.10.1
      - name: Audit every requirements file
        run: |
          status=0
          for file in $(git ls-files '*requirements*.txt'); do
            echo "::group::$file"
            pip-audit --progress-spinner off -r "$file" || status=1
            echo "::endgroup::"
          done
          exit $status
